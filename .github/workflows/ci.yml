name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: pelacak_magang_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run tests
        run: php artisan test
      - name: Build Docker image
        run: docker build -t pelacak-backend:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name backend-smoke -p 8000:8000 \
            -e APP_ENV=production \
            -e APP_KEY=base64:$(openssl rand -base64 32) \
            pelacak-backend:ci
            curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8000/up
      - name: Show container logs on failure
        if: failure()
        run: docker logs backend-smoke || true
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Show build output
        run: ls -la dist
      - name: Build Docker image
        run: docker build -t pelacak-frontend:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name frontend-smoke -p 8080:80 pelacak-frontend:ci
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080/
          curl --fail http://localhost:8080/login
      - name: Show container logs on failure
        if: failure()
        run: docker logs frontend-smoke || true