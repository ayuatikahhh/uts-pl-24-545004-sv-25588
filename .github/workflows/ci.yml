name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: pelacak_magang_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run tests
        run: php artisan test
      - name: Build Docker image
        run: docker build -t pelacak-backend:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name backend-smoke -p 8000:8000 \
            -e APP_ENV=production \
            -e APP_KEY=base64:$(openssl rand -base64 32) \
            pelacak-backend:ci
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8000/up
      - name: Show container logs on failure
        if: failure()
        run: docker logs backend-smoke || true
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Show build output
        run: ls -la dist
      - name: Build Docker image
        run: docker build -t pelacak-frontend:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name frontend-smoke -p 8080:80 pelacak-frontend:ci
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080/
          curl --fail http://localhost:8080/login
      - name: Show container logs on failure
        if: failure()
        run: docker logs frontend-smoke || true
      - name: Full stack smoke test (Docker Compose)
        working-directory: .
        run: |
          docker rm -f frontend-smoke
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
          docker compose up -d --build --wait --wait-timeout 240
          docker compose ps
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors \
            -X POST http://localhost:8080/api/login \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -d '{"email":"demo@example.com","password":"password"}'
      - name: Show compose logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs --no-color || true
      - name: Tear down compose stack
        if: always()
        working-directory: .
        run: docker compose down -v || true

  deploy:
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare image names and variables
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=ghcr.io/${OWNER}/pelacak-backend:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER}/pelacak-frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "DB_ROOT_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build images
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -t "$BACKEND_IMAGE" backend
          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -t "$FRONTEND_IMAGE" frontend
      - name: Push images to ghcr.io
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
      - name: Verify the published images with Compose
        run: |
          docker rmi "$BACKEND_IMAGE" "$FRONTEND_IMAGE"
          cp .env.example .env
          docker compose up -d --no-build --wait --wait-timeout 240
          docker compose ps
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors \
            -X POST http://localhost:8080/api/login \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -d '{"email":"demo@example.com","password":"password"}'
      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Tear down compose stack
        if: always()
        run: docker compose down -v || true